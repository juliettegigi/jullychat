
<div class="container">
  @if(vista==='inicio'){
    <app-menu-barra-lateral (clickNuevoMsg)="onClickNuevoMensaje()" 
                            (agregarPersonaClick)="onClickNuevoContacto()">
    </app-menu-barra-lateral>
    
    <div class="row">
        @switch(currentBtnMenu){
          @case('inputSearch')  { 
              <div class="col" >
                     <p>proximamente</p> 
                </div>
            }
          @case("nuevoContacto"){
             <div class="col" >
                 <app-input-search [funcion]="buscarUsuario">
                 </app-input-search> 
                 <app-lista-usuarios [btn]="agregarContacto" 
                                     [resultados]="resultados"
                                     >   </app-lista-usuarios>
             </div>
            }
            @case("nuevoMsg"){
              <div class="col" >
                   <app-lista-usuarios  [resultados]="resultados"
                                        [clickLi]="clickLiNuevoMsg">  
                   </app-lista-usuarios>
              </div>

            }
          @default{
            <app-lista-chats  [chats]="chats"
                              [clickLi]="onClickChatConUsuario">  
            </app-lista-chats>
          }  
        }
    </div>
   

 }@else {
   <div class="row" >  
    <div class="col">
      <svg (click)="onClickInicio()" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
      </svg>
    </div>
   </div>

   <div class="row">
        <div class="col">
          <p>proximamente...</p>
  
        </div>
  </div>
  <div class="row">
        <div class="col">
            <app-lista-mis-contactos>

            </app-lista-mis-contactos>        
        </div>
  </div>

 }
</div>
