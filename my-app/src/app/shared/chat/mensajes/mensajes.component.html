<div class="chat-container">

  @if (mensajes.length) {
    <div class="chat-messages">

      @for (mensaje of mensajes; track $index) {

        <div
          class="mensaje"
          [ngClass]="mensaje.emisorId == authService.userId
            ? 'mensaje-propio'
            : 'mensaje-ajeno'"
        >
          <div class="burbuja">
            <span class="texto">
              {{ mensaje.contenido }}
            </span>

            <span class="hora">
              {{ mensaje.createdAt | date:'HH:mm' }}
            </span>
          </div>
        </div>

      }

    </div>
  }

</div>
