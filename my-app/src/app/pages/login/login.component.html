<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email">
      <mat-error *ngIf="loginForm.get('email')?.hasError('required')">El email es obligatorio</mat-error>
      <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Email inválido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="password">
      <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Contraseña obligatoria</mat-error>
      <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
    </mat-form-field>

    <div *ngIf="loginError" class="error-message">{{ loginError }}</div>

    <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="loginForm.invalid || loading">
      {{ loading ? 'Ingresando...' : 'Iniciar sesión' }}
    </button>
  </form>
</div>
